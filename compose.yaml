name: message-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: messageboard
      POSTGRES_USER: messageboard
      POSTGRES_PASSWORD: messageboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: message-api:1.0
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messageboard
      SPRING_DATASOURCE_USERNAME: messageboard
      SPRING_DATASOURCE_PASSWORD: messageboard
    depends_on:
      - postgres

volumes:
  postgres_data:
